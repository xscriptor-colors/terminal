format = """
[](fg:#3f4451)\
$username\
$hostname\
[](fg:#3f4451)\
$os\
[>](fg:#c162de)\
[](fg:#e05561)\
$time\
$battery\
[](fg:#e05561 bg:#42b3c2)\
$directory\
[](fg:#42b3c2)\
$nodejs\
$rust\
$golang\
$php\
$java\
$julia\
$ocaml\
$zig\
$lua\
$python\
$ruby\
$dart\
$c\
$git_branch\
$git_status\
$cmd_duration\
$status\
\n$character"""

[username]
style_user = "fg:#d18f52 bg:#3f4451"
style_root = "fg:#e05561 bg:#3f4451"
format = "[ $user ]($style)"
show_always = true

[hostname]
style = "fg:#e6e6e6 bg:#3f4451"
format = "[@$hostname ]($style)"
ssh_only = false

[directory]
style = "fg:#3f4451 bg:#42b3c2"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "

[os]
disabled = false
style = "fg:#c162de"

[os.symbols]
AIX = "  "
ALTLinux = "  "
AOSC = "  "
AlmaLinux = "  "
Alpaquita = "  "
Alpine = "  "
Amazon = "  "
Android = "  "
Arch = " 󰣇 "
Artix = " 󰣇 "
Bluefin = "  "
CachyOS = "  "
CentOS = "  "
Debian = " 󰣚 "
DragonFly = "  "
Elementary = "  "
Emscripten = "  "
EndeavourOS = "  "
Fedora = " 󰣛 "
FreeBSD = "  "
Garuda = "  "
Gentoo = " 󰣨 "
HardenedBSD = " 󰞌 "
Illumos = "  "
InstantOS = "  "
Ios = " 󰀷 "
Kali = "  "
Linux = " 󰌽 "
Mabox = "  "
Macos = " 󰀵 "
Manjaro = "  "
Mariner = "  "
MidnightBSD = "  "
Mint = " 󰣭 "
NetBSD = "  "
NixOS = "  "
Nobara = "  "
OpenBSD = "  "
OpenCloudOS = "  "
OracleLinux = " 󰺡 "
PikaOS = "  "
Pop = "  "
Raspbian = " 󰐿 "
RedHatEnterprise = " 󱄛 "
Redhat = " 󱄛 "
Redox = " 󰀘 "
RockyLinux = "  "
SUSE = "  "
Solus = "  "
Ubuntu = " 󰕈 "
Ultramarine = "  "
Unknown = "  "
Uos = "  "
Void = "  "
Windows = " 󰍲 "
Zorin = "  "
openEuler = "  "
openSUSE = "  "


[git_branch]
symbol = ""
style = "fg:#e6e6e6"
format = "[>](fg:#e6e6e6)[[ $symbol $branch ](fg:#e6e6e6)]($style)"

[git_status]
style = "fg:#e6e6e6"
format = "[[($all_status$ahead_behind )](fg:#e6e6e6)]($style)"

[git_metrics]
disabled = true

[nodejs]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[rust]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[golang]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[php]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[java]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[julia]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[ocaml]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[zig]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[lua]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[python]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[ruby]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[dart]
symbol = ""
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[c]
symbol = "󰬊"
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[ $symbol ($version) ](fg:#42b3c2)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#e05561"
format = "[[  $time ](fg:#3f4451 bg:#e05561)]($style)"

[cmd_duration]
min_time = 800
style = "fg:#42b3c2"
format = "[>](fg:#42b3c2)[[  $duration ](fg:#42b3c2)]($style)"

[status]
disabled = false
style = "fg:#e05561"
format = "[>](fg:#e05561)[[ $status ](fg:#e05561)]($style)"

[memory_usage]
disabled = true

[battery]
disabled = false
full_symbol = ""
charging_symbol = ""
discharging_symbol = ""
format = "[ $symbol $percentage ]($style)"

[[battery.display]]
threshold = 20
style = "bold fg:#3f4451 bg:#e05561"

[[battery.display]]
threshold = 100
style = "fg:#d18f52 bg:#e05561"

[character]
success_symbol = "[>](bold #8cc265)"
error_symbol = "[>](bold #e05561)"
