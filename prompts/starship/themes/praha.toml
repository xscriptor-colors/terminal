format = """
[](fg:#1A1A1A)\
$username\
$hostname\
[](fg:#1A1A1A)\
$os\
[>](fg:#FF9AA2)\
[](fg:#FF5555)\
$time\
$battery\
[](fg:#FF5555 bg:#8BE9FD)\
$directory\
[](fg:#8BE9FD)\
$nodejs\
$rust\
$golang\
$php\
$java\
$julia\
$ocaml\
$zig\
$lua\
$python\
$ruby\
$dart\
$c\
$git_branch\
$git_status\
$cmd_duration\
$status\
\n$character"""

[username]
style_user = "fg:#FFE4A3 bg:#1A1A1A"
style_root = "fg:#FF5555 bg:#1A1A1A"
format = "[ $user ]($style)"
show_always = true

[hostname]
style = "fg:#FFFFFF bg:#1A1A1A"
format = "[@$hostname ]($style)"
ssh_only = false

[directory]
style = "fg:#1A1A1A bg:#8BE9FD"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
"Videos" = " "

[os]
disabled = false
style = "fg:#FF9AA2"

[os.symbols]
AIX = "  "
ALTLinux = "  "
AOSC = "  "
AlmaLinux = "  "
Alpaquita = "  "
Alpine = "  "
Amazon = "  "
Android = "  "
Arch = " 󰣇 "
Artix = " 󰣇 "
Bluefin = "  "
CachyOS = "  "
CentOS = "  "
Debian = " 󰣚 "
DragonFly = "  "
Elementary = "  "
Emscripten = "  "
EndeavourOS = "  "
Fedora = " 󰣛 "
FreeBSD = "  "
Garuda = "  "
Gentoo = " 󰣨 "
HardenedBSD = " 󰞌 "
Illumos = "  "
InstantOS = "  "
Ios = " 󰀷 "
Kali = "  "
Linux = " 󰌽 "
Mabox = "  "
Macos = " 󰀵 "
Manjaro = "  "
Mariner = "  "
MidnightBSD = "  "
Mint = " 󰣭 "
NetBSD = "  "
NixOS = "  "
Nobara = "  "
OpenBSD = "  "
OpenCloudOS = "  "
OracleLinux = " 󰺡 "
PikaOS = "  "
Pop = "  "
Raspbian = " 󰐿 "
RedHatEnterprise = " 󱄛 "
Redhat = " 󱄛 "
Redox = " 󰀘 "
RockyLinux = "  "
SUSE = "  "
Solus = "  "
Ubuntu = " 󰕈 "
Ultramarine = "  "
Unknown = "  "
Uos = "  "
Void = "  "
Windows = " 󰍲 "
Zorin = "  "
openEuler = "  "
openSUSE = "  "


[git_branch]
symbol = ""
style = "fg:#FFFFFF"
format = "[>](fg:#FFFFFF)[[ $symbol $branch ](fg:#FFFFFF)]($style)"

[git_status]
style = "fg:#FFFFFF"
format = "[[($all_status$ahead_behind )](fg:#FFFFFF)]($style)"

[git_metrics]
disabled = true

[nodejs]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[rust]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[golang]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[php]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[java]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[julia]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[ocaml]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[zig]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[lua]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[python]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[ruby]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[dart]
symbol = ""
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[c]
symbol = "󰬊"
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[ $symbol ($version) ](fg:#8BE9FD)]($style)"

[time]
disabled = false
time_format = "%R"
style = "bg:#FF5555"
format = "[[  $time ](fg:#1A1A1A bg:#FF5555)]($style)"

[cmd_duration]
min_time = 800
style = "fg:#8BE9FD"
format = "[>](fg:#8BE9FD)[[  $duration ](fg:#8BE9FD)]($style)"

[status]
disabled = false
style = "fg:#FF5555"
format = "[>](fg:#FF5555)[[ $status ](fg:#FF5555)]($style)"

[memory_usage]
disabled = true

[battery]
disabled = false
full_symbol = ""
charging_symbol = ""
discharging_symbol = ""
format = "[ $symbol $percentage ]($style)"

[[battery.display]]
threshold = 20
style = "bold fg:#1A1A1A bg:#FF5555"

[[battery.display]]
threshold = 100
style = "fg:#FFE4A3 bg:#FF5555"

[character]
success_symbol = "[>](bold #B8E6A0)"
error_symbol = "[>](bold #FF5555)"
